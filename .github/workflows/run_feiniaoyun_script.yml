name: Update feiniaoyun

on:
  schedule:
    - cron: "23 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-subscribe
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Fetch subscribe link
        env:
          APP_EMAIL: ${{ secrets.APP_EMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          APP_KEY: ${{ secrets.APP_KEY }}
        run: python feiniaoyun.py

      - name: Upload error screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshots
          path: error_*.png
          if-no-files-found: ignore

      - name: Commit result
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A feiniaoyun 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "update subscribe $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
