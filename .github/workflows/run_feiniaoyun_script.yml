name: Run Feiniaoyun Selenium Script

on:
  schedule:
    - cron: '0 19 */2 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install selenium webdriver-manager

    - name: Run Python Selenium Script
      env:
        APP_EMAIL: ${{ secrets.APP_EMAIL }}
        APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        APP_KEY: ${{ secrets.APP_KEY }}
      run: python feiniaoyun.py

    # 无论成功失败都上传，方便确认到底有没有生成
    - name: Upload error screenshot
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: error-screenshot
        path: error.png
        if-no-files-found: warn

    - name: Commit and Push to Repository
      if: success()
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add feiniaoyun/
        if git diff --staged --quiet; then
          echo "没有变化，跳过提交"
        else
          git commit -m "Auto update feiniaoyun subscription and logs"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
        fi

    - name: Upload subscribe link file
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: subscribe-link-file
        path: feiniaoyun/
        if-no-files-found: warn
