name: Cold Cache Warmup

on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 */2 * *'

permissions:
  contents: write

jobs:
  warmup:
    runs-on: ubuntu-latest

    steps:
      - name: 0. 检出代码仓库
        uses: actions/checkout@v4

      - name: 1. 安装 Python 依赖环境
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 2. 读取 Sitemap、校验 SQLite 历史并执行预热
        env:
          SITEMAP_URL: ${{ secrets.sitemap }}
          TARGET_HOST: ${{ secrets.host }}
        run: |
          python - << 'EOF'
          import os
          import sys
          import time
          import random
          import re
          import sqlite3
          import requests

          sitemap_url = os.environ.get('SITEMAP_URL')
          target_host = os.environ.get('TARGET_HOST', '').strip()

          if not sitemap_url:
              print("❌ 错误: 未找到 secrets.sitemap 变量！")
              sys.exit(1)

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Cache-Control': 'no-cache',
              'Pragma': 'no-cache'
          }

          def mask_url(url):
              if not target_host:
                  return url
              masked = url.replace(target_host, 'google.com')
              raw_domain = target_host.replace('www.', '')
              return masked.replace(raw_domain, 'google.com')

          db_file = 'warmup_history.db'
          conn = sqlite3.connect(db_file)
          cursor = conn.cursor()
          
          cursor.execute('''
              CREATE TABLE IF NOT EXISTS warmup_history (
                  url TEXT PRIMARY KEY,
                  weight INTEGER DEFAULT 1,
                  selected_at INTEGER
              )
          ''')
          conn.commit()

          current_time = int(time.time())
          thirty_days_seconds = 30 * 24 * 3600

          cursor.execute('DELETE FROM warmup_history WHERE (? - selected_at) > ?', (current_time, thirty_days_seconds))
          deleted_rows = cursor.rowcount
          conn.commit()
          if deleted_rows > 0:
              print(f"🧹 已自动清理 {deleted_rows} 条超过 30 天的历史记录。")

          cursor.execute('SELECT url FROM warmup_history WHERE (? - selected_at) <= ?', (current_time, thirty_days_seconds))
          recently_selected_set = set(row[0] for row in cursor.fetchall())

          print("🔍 正在获取 Sitemap 页面列表...")
          try:
              res = requests.get(sitemap_url, headers=headers, timeout=15)
              res.raise_for_status()
              
              res.encoding = res.apparent_encoding or 'utf-8'
              content_text = res.text

              all_urls = re.findall(r'<loc>(.*?)</loc>', content_text, re.IGNORECASE)
              all_urls = [u.strip() for u in all_urls if u.strip()]

              if not all_urls:
                  print("❌ 未能提取到任何 URL，请检查 secrets.sitemap 链接是否正确！")
                  sys.exit(1)

              protocol = "https://" if sitemap_url.startswith("https://") else "http://"
              base_url = f"{protocol}{target_host}".rstrip('/')

              must_have_targets = [
                  base_url,
                  f"{base_url}/product/",
                  f"{base_url}/serial/"
              ]

              mandatory_selected = []
              candidate_pool = []

              for url in all_urls:
                  norm_url = url.rstrip('/')
                  if any(norm_url == target.rstrip('/') for target in must_have_targets):
                      if url not in mandatory_selected:
                          mandatory_selected.append(url)
                  else:
                      if url not in recently_selected_set:
                          candidate_pool.append(url)

              for target in [f"{base_url}/", f"{base_url}/product/", f"{base_url}/serial/"]:
                  if not any(target.rstrip('/') == m.rstrip('/') for m in mandatory_selected):
                      mandatory_selected.append(target)

              needed_count = max(0, 50 - len(mandatory_selected))

              if len(candidate_pool) < needed_count:
                  print(f"⚠️ 30天内未访问候选池不足 ({len(candidate_pool)} < {needed_count})，将从全量未访问及已冷却池中抽取。")
                  candidate_pool = [u for u in all_urls if not any(u.rstrip('/') == target.rstrip('/') for target in must_have_targets)]

              random_selected = random.sample(candidate_pool, min(needed_count, len(candidate_pool)))

              final_urls = mandatory_selected + random_selected
              total = len(final_urls)

              for u in final_urls:
                  cursor.execute('''
                      INSERT INTO warmup_history (url, weight, selected_at)
                      VALUES (?, 1, ?)
                      ON CONFLICT(url) DO UPDATE SET
                          weight = weight + 1,
                          selected_at = excluded.selected_at
                  ''', (u, current_time))
              conn.commit()

              masked_urls_list = [mask_url(u) for u in final_urls]
              print(f"🎉 成功提取并准备好 {total} 个页面：")
              print(f"📋 预热页面列表（域名已打码）: {masked_urls_list}\n")

              print(f"🚀 开始慢速预热（共 {total} 页，每页间隔 10~30 秒）...\n")

              for idx, url in enumerate(final_urls, 1):
                  display_url = mask_url(url)
                  try:
                      res = requests.get(url, headers=headers, timeout=15)
                      print(f"[{res.status_code}] ({idx}/{total}) 预热成功: {display_url}", flush=True)
                  except Exception as e:
                      print(f"[FAIL] ({idx}/{total}) 预热失败 {display_url}: {e}", flush=True)

                  if idx < total:
                      sleep_time = random.uniform(10.0, 30.0)
                      time.sleep(sleep_time)

              print("\n✅ 冷缓存慢速预热完全结束！")

          except Exception as e:
              print(f"❌ 读取或解析 Sitemap 失败: {e}")
              sys.exit(1)
          finally:
              conn.close()
          EOF

      - name: 3. 保存更新后的 SQLite 数据库至 Git 仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add warmup_history.db
          git commit -m "chore: update warmup sqlite db history [skip ci]" || exit 0
          git push origin HEAD:${{ github.ref_name }}
